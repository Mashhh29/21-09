<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b2e">
  <title>Un video para ti 🎬</title>
  <link rel="icon" href="img/video.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cielo" aria-hidden="true"></div>
  <div class="estrellas" aria-hidden="true"></div>

  <a class="volver" href="index.html">← Volver</a>

  <main class="pagina-video">
    <div class="video-zona">

      <!-- EDITA ESTE TEXTO CUANDO QUIERAS -->
      <h1 class="video-titulo">Dale play, esto es para ti</h1>

      <!--
        DOS FORMAS DE PONER TU VIDEO
        ============================
        A) Video tuyo (recomendado): copia tu archivo en la carpeta "video/"
           con el nombre mi-video.mp4 y deja el bloque de abajo como está.

        B) Video de YouTube: borra el bloque <video> y descomenta el <iframe>,
           cambiando ID_DEL_VIDEO por el código que sale en el enlace.

        Si tu video es horizontal, cambia marco--vertical por marco--horizontal.
      -->

      <div class="marco marco--vertical">
        <video controls playsinline preload="metadata" poster="img/flowers.png">
          <source src="video/mi-video.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>

        <!--
        <iframe
          src="https://www.youtube.com/embed/ID_DEL_VIDEO"
          title="Video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
        -->
      </div>

      <p class="video-nota">Si no se ve nada todavía, es porque falta subir el archivo <strong>video/mi-video.mp4</strong> al repositorio.</p>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b2532">
    <title>Un detalle para ti 💛</title>
    <link rel="icon" href="img/girasol.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="landing" aria-labelledby="titulo-principal">
        <div class="aurora aurora--gold" aria-hidden="true"></div>
        <div class="aurora aurora--green" aria-hidden="true"></div>
        <div class="aurora aurora--rose" aria-hidden="true"></div>

        <div class="decor decor--one" aria-hidden="true">✦</div>
        <div class="decor decor--two" aria-hidden="true">✧</div>
        <div class="decor decor--three" aria-hidden="true">✦</div>
        <div class="decor decor--four" aria-hidden="true">✧</div>

        <section class="welcome-card">
            <div class="hero-flower" aria-hidden="true">
                <img src="img/girasol.svg" alt="">
            </div>

            <!-- EDITA ESTE TEXTO CUANDO QUIERAS -->
            <p id="titulo-principal" class="welcome-text">
                Buenas buenas miamor, se que es el día de las flores amarillas así que te hice un par de cositas espero que te guste
            </p>

            <div class="options" aria-label="Opciones del detalle">
                <a class="option option--video" href="video.html">
                    <span class="option-picture">
                        <img src="img/video.svg" alt="" aria-hidden="true">
                    </span>
                    <span class="option-copy">
                        <strong>Mostrar video</strong>
                        <small>Primero mira esto ♡</small>
                    </span>
                    <span class="option-action" aria-hidden="true">Abrir</span>
                </a>

                <a class="option option--letter" href="carta.html">
                    <span class="option-picture">
                        <img src="img/carta.svg" alt="" aria-hidden="true">
                    </span>
                    <span class="option-copy">
                        <strong>Mostrar carta</strong>
                        <small>Hay algo que quiero decirte</small>
                    </span>
                    <span class="option-action" aria-hidden="true">Abrir</span>
                </a>

                <a class="option option--flowers" href="flower.html">
                    <span class="option-picture">
                        <img src="img/girasol.svg" alt="" aria-hidden="true">
                    </span>
                    <span class="option-copy">
                        <strong>Mostrar flores</strong>
                        <small>Una sorpresita amarilla ✨</small>
                    </span>
                    <span class="option-action" aria-hidden="true">Abrir</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>

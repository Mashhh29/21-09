<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b2e">
  <title>Un detalle para ti 💛</title>
  <link rel="icon" href="img/girasol.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cielo" aria-hidden="true"></div>
  <div class="estrellas" aria-hidden="true"></div>

  <main class="portada">
    <img class="girasol-sello" src="img/girasol.svg" alt="" aria-hidden="true">

    <!-- EDITA ESTE TEXTO CUANDO QUIERAS -->
    <p class="saludo">
      Buenas buenas miamor, se que es el día de las flores amarillas así que te hice un par de cositas espero que te guste
    </p>

    <nav class="opciones" aria-label="Qué te hice">
      <a class="opcion" href="video.html" style="--n:0">
        <span class="opcion-icono"><img src="img/video.svg" alt="" aria-hidden="true"></span>
        <span class="opcion-texto">
          <strong>Mostrar video</strong>
          <small>Empieza por acá</small>
        </span>
        <span class="opcion-accion">Abrir</span>
      </a>

      <a class="opcion" href="carta.html" style="--n:1">
        <span class="opcion-icono"><img src="img/carta.svg" alt="" aria-hidden="true"></span>
        <span class="opcion-texto">
          <strong>Mostrar carta</strong>
          <small>Hay algo que quiero decirte</small>
        </span>
        <span class="opcion-accion">Abrir</span>
      </a>

      <a class="opcion" href="flower.html" style="--n:2">
        <span class="opcion-icono"><img src="img/girasol.svg" alt="" aria-hidden="true"></span>
        <span class="opcion-texto">
          <strong>Mostrar flores</strong>
          <small>Tres girasoles que crecen solos</small>
        </span>
        <span class="opcion-accion">Abrir</span>
      </a>
    </nav>

    <p class="pie">Hecho a mano, para ti 💛</p>
  </main>

</html>
